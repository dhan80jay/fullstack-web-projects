<div class="form-page">

  <div class="page-header">

    <div>
      <h1>Create Bill</h1>
      <p>Create a billing record for a patient appointment</p>
    </div>

    <button
      type="button"
      routerLink="/dashboard/admin/billing"
      class="back-btn">

      <i class="bi bi-arrow-left"></i>
      Back to Billing

    </button>

  </div>


  <div class="form-card">

    <div class="form-card-header">

      <div class="header-icon">

        <i class="bi bi-receipt-cutoff"></i>

      </div>

      <div>

        <h2>Billing Information</h2>

        <p>
          Enter consultation, medicine and other charges
        </p>

      </div>

    </div>


    <form class="form-body">


      <!-- Appointment -->

      <div class="section-title">

        <i class="bi bi-calendar-check-fill"></i>
        Appointment Information

      </div>


      <div class="form-grid">


        <div class="form-group full-width">

          <label for="appointment">
            Appointment <span>*</span>
          </label>

          <div class="input-box">

            <i class="bi bi-calendar-event-fill"></i>

            <select
              id="appointment"
              name="appointment"
              [(ngModel)]="bill.appointment">

              <option value="">
                Select appointment
              </option>
              @for (appointment of appointments; track appointment.id) {
              <option [ngValue]="appointment">
                #APT-{{appointment.id}} - {{appointment.patient.firstName }} {{appointment.patient.lastName}} - {{appointment.appointmentDate | date:'dd/MMM/yyyy'}}
              </option>
            }
            </select>

          </div>

        </div>


        <!-- <div class="form-group">

          <label for="billingDate">
            Billing Date <span>*</span>
          </label>

          <div class="input-box">

            <i class="bi bi-calendar3"></i>

            <input
              type="date"
              id="billingDate"
              name="billingDate"
              [(ngModel)]="bill.billingDate">

          </div>

        </div> -->


        <div class="form-group">

          <label for="paymentStatus">
            Payment Status <span>*</span>
          </label>

          <div class="input-box">

            <i class="bi bi-credit-card-fill"></i>

            <select
              id="paymentStatus"
              name="paymentStatus"
              [(ngModel)]="bill.paymentStatus">

              <option value="">
                Select payment status
              </option>

              <option>PAID</option>
              <option>PENDING</option>
              <option>FAILED</option>

            </select>

          </div>

        </div>

      </div>


      <!-- Charges -->

      <div class="section-title section-spacing">

        <i class="bi bi-currency-rupee"></i>
        Charges

      </div>


      <div class="charges-grid">


        <div class="charge-card">

          <div class="charge-icon">

            <i class="bi bi-person-badge-fill"></i>

          </div>

          <div>

            <label>
              Consultation Fee
            </label>

            <div class="amount-input">

              <span>₹</span>

              <input
                type="number"
                name="consultationFee"
                placeholder="0.00"
                [(ngModel)]="bill.consultationFee">

            </div>

          </div>

        </div>


        <div class="charge-card">

          <div class="charge-icon medicine-charge">

            <i class="bi bi-capsule-pill"></i>

          </div>

          <div>

            <label>
              Medicine Charges
            </label>

            <div class="amount-input">

              <span>₹</span>

              <input
                type="number"
                name="medicineCharges"
                placeholder="0.00"
                [(ngModel)]="bill.medicineCharges">

            </div>

          </div>

        </div>


        <div class="charge-card">

          <div class="charge-icon other-charge">

            <i class="bi bi-receipt"></i>

          </div>

          <div>

            <label>
              Other Charges
            </label>

            <div class="amount-input">

              <span>₹</span>

              <input
                type="number"
                name="otherCharges"
                placeholder="0.00"
                [(ngModel)]="bill.otherCharges">

            </div>

          </div>

        </div>


      </div>


      <!-- Total -->

      <div class="total-box">

        <div>

          <span>Total Amount</span>

          <small>
            Consultation + Medicine + Other Charges
          </small>

        </div>

        <strong>
         {{totalAmount()}}
        </strong>

      </div>


      <!-- Footer -->

      <div class="form-footer">

        <button
          type="button"
          class="cancel-btn"
          routerLink="/dashboard/admin/billing">

          <i class="bi bi-x-lg"></i>
          Cancel

        </button>


        <button
          type="submit"
          class="save-btn"
          (click)="createBill()">

          <i class="bi bi-receipt-cutoff"></i>
          Create Bill

        </button>

      </div>


    </form>

  </div>

</div>
